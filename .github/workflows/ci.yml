name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in server/package.json engines, and current LTS.
        node: ['22.12', '22']

    # The suite needs a real PostgreSQL: it runs the migrations and asserts on
    # schema facts. Each test file isolates itself in its own schema, so one
    # instance serves the whole run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gearguard
          POSTGRES_PASSWORD: gearguard
          POSTGRES_DB: gearguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run lint

      # SMTP is stubbed by the harness, so no secrets are needed.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://gearguard:gearguard@127.0.0.1:5432/gearguard

  client:
    name: Client (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '22']
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # A green test run can still ship a broken bundle; build proves it links.
      - run: npm run build
